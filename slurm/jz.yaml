# configs/paths/jz.yaml  --  package: paths
#
# All roots come from the environment. Rationale: in August 2024 IDRIS moved HOME, WORK
# and STORE from Spectrum Scale to Lustre; $WORK is now /lustre/fswork/projects/rech/...,
# $SCRATCH is /lustre/fsn1/projects/rech/... . The old /gpfswork/... absolute paths were
# kept as compatibility symlinks "at least to begin with" -- IDRIS explicitly asks that
# they be replaced by the environment variables. A hard-coded /gpfswork path in a
# submitit_folder is a prime candidate for a job that dies before it can write a log.
#
# These variables are set by the Jean Zay profile on the compute nodes AND propagated by
# Slurm (--export=ALL is the default), so they resolve on both sides for two independent
# reasons.

work: ${oc.env:WORK}
scratch: ${oc.env:SCRATCH}
datasets: ${oc.env:DSDIR}

# Results: SCRATCH is the fast Lustre space but is purged and not backed up; WORK is
# backed up and quota'd. Pick one deliberately.
results: ${paths.work}/_Experiments/GroupedNewton_Results
