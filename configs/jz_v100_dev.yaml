# @package hydra.launcher
#
# Jean Zay, V100, development QoS. Use for every first submission of a new sweep.
#
# HARD LIMIT, and a likely cause of an opaque rejection: qos_gpu-dev allows
# "a maximum of 10 jobs simultaneously (running or pending) per user", 2 h wall-clock.
# Slurm counts array *tasks* against that limit, so a --multirun producing 11 or more
# configurations is rejected at submission time under this QoS. Keep sweeps <= 10 here.

account: ${oc.env:GRNEWT_PROJECT}@v100

partition: null
constraint: null
qos: qos_gpu-dev
timeout_min: 110           # < 2 h ceiling, with margin

nodes: 1
tasks_per_node: 1
cpus_per_task: 10
gres: gpu:1
gpus_per_node: null
gpus_per_task: null
cpus_per_gpu: null
mem_gb: null
mem_per_gpu: null
mem_per_cpu: null

additional_parameters:
  hint: nomultithread

setup:
  - "module purge"
  - "module load pytorch-gpu/py3/2.4.0"
  - "export OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK"
  - "export PYTHONUNBUFFERED=1"
  - "export HF_HUB_OFFLINE=1"
  - "export TORCH_HOME=$WORK/.cache/torch"

submitit_folder: ${hydra.sweep.dir}/.submitit/%j
name: ${expe_series}
stderr_to_stdout: true
signal_delay_s: 120
max_num_timeout: 0
array_parallelism: 8       # <= 10, see the QoS limit above
comment: null
exclude: null
