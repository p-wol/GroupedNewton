# @package hydra.launcher
#
# For local, single-process runs (laptop, or an interactive allocation on Jean Zay).
#
# Hydra only *instantiates* a launcher in --multirun; a single run composes this node and
# never touches it. The only reason this file exists is to remove the
# `${oc.env:GRNEWT_PROJECT}` interpolation from the composed config, so that a machine
# where that variable is undefined cannot fail for a reason unrelated to the run.
#
# It is NOT usable for a local sweep: _target_ still comes from the submitit_slurm
# schema. For a local sweep, loop in the shell (see docs/SLURM_JEANZAY.md).

account: null
partition: null
constraint: null
qos: null
timeout_min: 60

nodes: 1
tasks_per_node: 1
cpus_per_task: null
gres: null
gpus_per_node: null
gpus_per_task: null
cpus_per_gpu: null
mem_gb: null
mem_per_gpu: null
mem_per_cpu: null

additional_parameters: {}
setup: null

submitit_folder: ${hydra.sweep.dir}/.submitit/%j
name: ${expe_series}
stderr_to_stdout: true
signal_delay_s: 120
max_num_timeout: 0
array_parallelism: 1
comment: null
exclude: null
