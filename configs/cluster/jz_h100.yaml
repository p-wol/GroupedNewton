# @package hydra.launcher
#
# Jean Zay, H100 quadri-GPU nodes (96 Intel cores, 4 x H100 80 GB).
#   - accounting type: <project>@h100
#   - QoS names: qos_gpu_h100-t3 (20 h) / -t4 (100 h) / -dev (2 h)
#   - `module load arch/h100` is required; the default modules do not work here
# The pytorch module version below must be one that exists under arch/h100:
# check with `module load arch/h100 && module avail pytorch-gpu`.

account: ${oc.env:GRNEWT_PROJECT}@h100

partition: null
constraint: h100
qos: qos_gpu_h100-t3
timeout_min: 1150

nodes: 1
tasks_per_node: 1
cpus_per_task: 24          # 96 cores / 4 GPUs
gres: gpu:1
gpus_per_node: null
gpus_per_task: null
cpus_per_gpu: null
mem_gb: null
mem_per_gpu: null
mem_per_cpu: null

additional_parameters:
  hint: nomultithread

setup:
  - "module purge"
  - "module load arch/h100"
  - "module load pytorch-gpu/py3/2.4.0"
  - "export OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK"
  - "export PYTHONUNBUFFERED=1"
  - "export HF_HUB_OFFLINE=1"
  - "export TORCH_HOME=$WORK/.cache/torch"

submitit_folder: ${hydra.sweep.dir}/.submitit/%j
name: ${expe_series}
stderr_to_stdout: true
signal_delay_s: 120
max_num_timeout: 0
array_parallelism: 16
comment: null
exclude: null
