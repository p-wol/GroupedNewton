# @package hydra.launcher
#
# Jean Zay, V100 quadri-GPU nodes (40 cores, 160 GB usable RAM, 4 GPUs), 1 GPU per job.
# Merged on top of the SlurmQueueConf schema registered by hydra-submitit-launcher:
# an unknown key here is a composition-time error, which is what we want.

# --- accounting -------------------------------------------------------------------
# MANDATORY on Jean Zay. IDRIS documents the account as "must be specified":
# --account=<3-letter project>@v100 for V100 hours. Exported by slurm/submit.sh.
# If JZ_PROJECT is unset, composition fails on the login node with a readable error,
# which is strictly better than an sbatch rejection buried in a submitit pickle.
account: ${oc.env:JZ_PROJECT}@v100

# --- placement --------------------------------------------------------------------
# The 4xV100 partition is the *default* GPU partition: IDRIS' summary table gives
# "default (no option)" for "40 CPUs + 160 GB + 4 V100". Do not name it. The historical
# name gpu_p13 still appears in the French pages but naming a partition buys nothing
# here and is one more thing that can be renamed under you.
partition: null
# null = accept both 16 GB and 32 GB V100s (shorter queue; IDRIS recommends this).
# Set to 'v100-32g' only if a run actually needs > 16 GB of GPU memory.
constraint: null
qos: qos_gpu-t3            # default V100 QoS, 20 h wall-clock ceiling
timeout_min: 1150          # < 20 h, with margin. qos_gpu-t4 would be needed beyond.

# --- resources --------------------------------------------------------------------
nodes: 1
tasks_per_node: 1
cpus_per_task: 10          # 40 cores / 4 GPUs = 10 cores per GPU on these nodes
gres: gpu:1                # the form IDRIS documents
gpus_per_node: null        # MUST stay null: submitit emits --gpus-per-node for this
                           # field, which would duplicate/conflict with --gres above.
gpus_per_task: null
cpus_per_gpu: null
mem_gb: null               # do not set: on Jean Zay memory follows the cores/GPUs asked
mem_per_gpu: null
mem_per_cpu: null

additional_parameters:
  hint: nomultithread      # -> #SBATCH --hint=nomultithread (no hyperthreading), as in
                           # the IDRIS submission templates

# --- job environment ---------------------------------------------------------------
# These lines are inserted verbatim in the sbatch script, before srun.
# NB: do NOT write ${VAR} here, OmegaConf would try to interpolate it. $VAR is safe.
setup:
  - "module purge"
  - "module load pytorch-gpu/py3/2.8.0"
  - "export OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK"
  - "export PYTHONUNBUFFERED=1"
  - "export HF_HUB_OFFLINE=1"
  - "export TORCH_HOME=$WORK/.cache/torch"
  # compute nodes have no route to the internet: any download attempt hangs until the
  # wall-clock limit rather than failing fast.

# --- bookkeeping --------------------------------------------------------------------
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
name: ${expe_series}
stderr_to_stdout: true     # one log per job instead of two
signal_delay_s: 120
max_num_timeout: 0         # no automatic requeue: the trainer cannot resume yet, a
                           # requeue would silently restart from scratch and bill it
array_parallelism: 16
comment: null
exclude: null
