[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GroupedNewton"
version = "0.1.0"
requires-python = ">=3.10"
description = "Grouped Newton: second-order optimization with a partition of the parameters"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Pierre Wolinski", email = "pierre.wolinski@dauphine.psl.eu"}]
maintainers = [{name = "Pierre Wolinski", email = "pierre.wolinski@dauphine.psl.eu"}]
keywords = ["optimization", "machine learning", "deep learning", "Hessian", "Newton's method"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.1.0",
  "numpy>=1.23.5",
  "scipy>=1.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-timeout>=2.2",
  "pytest-xdist>=3.5",
  "nbmake>=1.5",
  "ruff>=0.6",
]
experiments = [
  "torchvision>=0.15.1",
  "hydra-core>=1.3.2",            # NB: the PyPI package `hydra` is unrelated
  "hydra-submitit-launcher>=1.2",
  "omegaconf>=2.2.3",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/p-wol/GroupedNewton"
Repository = "https://github.com/p-wol/GroupedNewton"
Paper = "https://arxiv.org/abs/2312.03885"

[tool.hatch.build.targets.wheel]
packages = ["src/grnewt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--timeout=120",
]
markers = [
  "slow: deselect with -m 'not slow'",
  "gpu: requires CUDA",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["grnewt"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "NPY", "PD",
]
ignore = [
  "E501",          # line too long
  "E741",          # 'l' is an ambiguous variable name (looks like "1")
]
extend-safe-fixes = [
  "UP006",         # List -> list
  "W291",          # trailing whitespaces
]
